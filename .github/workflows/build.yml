name: Build macOS app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: ./scripts/build.sh
      - name: Verify legacy debounce without touching audio
        run: |
          ./scripts/build-legacy.sh
          cat Sources/AudioRecovery.swift Tests/RecoveryTests.swift > build/recovery-tests.swift
          swiftc -parse-as-library -module-cache-path build/cache build/recovery-tests.swift -o build/recovery-tests
          build/recovery-tests
      - name: Verify binary and bundle
        run: |
          lipo build/IOGuard.app/Contents/MacOS/IOGuard -verify_arch arm64 x86_64
          codesign --verify --deep --strict build/IOGuard.app
          plutil -lint build/IOGuard.app/Contents/Info.plist
          ditto -c -k --keepParent build/IOGuard.app build/IOGuard-development.zip
      - uses: actions/upload-artifact@v4
        with:
          name: IOGuard-development-unsigned
          path: build/IOGuard-development.zip
